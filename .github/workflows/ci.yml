name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }} amd64
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Rust 工具链
        run: rustup show
      - name: 安装 just
        run: cargo install just --version 1.58.0 --locked
      - name: 格式 lint 与测试
        run: just verify
      - name: 生成 Rust 用户与 API 文档
        run: just docs
      - name: 保存 Rust 文档
        uses: actions/upload-artifact@v4
        with:
          name: rustdoc-${{ runner.os }}
          path: target/doc/
      - name: 构建示例二进制
        run: just build
      - name: 验证共同执行、生命周期与事件处理链
        run: just execution-smoke lifecycle-smoke events-smoke application-smoke
      - name: 验证示例服务启动与退出
        run: just smoke
      - name: 验证共享端点内部 RPC
        run: just rpc-smoke
      - name: 验证真实 TCP 客户端业务
        run: just client-smoke
      - name: 验证生产服务配置
        run: just config-check examples/demo-game/config/game.toml

  redis-integration:
    name: Redis 开发发现与共享所有权集成
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Rust 工具链
        run: rustup show
      - name: 安装 just
        run: cargo install just --version 1.58.0 --locked
      - name: 验证真实 Redis 租约和目录缓存
        run: just redis-test
      - name: 验证游戏与网关双进程
        run: just redis-smoke
      - name: 验证 Redis 会话所有权
        run: just ownership-test
      - name: 验证 Redis 请求级锁
        run: just locks-test
      - name: 验证独立网关共享所有权
        run: just ownership-smoke
      - name: 验证三进程跨网关交接及宕机降级
        run: just handoff-smoke

  nats-integration:
    name: NATS 事件与多网关集成
    runs-on: ubuntu-latest
    services:
      nats:
        image: nats:2-alpine
        ports:
          - 4222:4222
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Rust 工具链
        run: rustup show
      - name: 安装 just
        run: cargo install just --version 1.58.0 --locked
      - name: 验证真实 NATS 订阅与动态主题
        run: just nats-test
      - name: 验证事件转发与广播
        run: just nats-smoke
