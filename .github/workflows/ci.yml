name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }} amd64
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Rust 工具链
        run: rustup show
      - name: 安装 just
        run: cargo install just --version 1.58.0 --locked
      - name: 格式 lint 与测试
        run: just verify
      - name: 构建示例二进制
        run: just build
      - name: 验证示例角色启动与退出
        run: just smoke
      - name: 验证生产角色配置
        run: just config-check examples/demo-game/config/game.toml
