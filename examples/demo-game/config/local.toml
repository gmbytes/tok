node_id = "local"
discovery = "memory"

[observability]
log_filter = "info"
log_format = "text"
# 按需启用；省略时不监听指标端口、不导出追踪。
# metrics_address = "127.0.0.1:9090"
# otlp_endpoint = "http://127.0.0.1:4317"
# trace_filter = "info"
# trace_sample_ratio = 1.0
# [[observability.trace_force_rules]]
# span = "client_request"
# fields = { player_id = 123 }

[[endpoints]]
name = "client"
protocol = "tcp"
address = "127.0.0.1:7000"

[[endpoints]]
name = "internal-rpc"
protocol = "grpc"
address = "127.0.0.1:7001"

[[services]]
service_name = "outside-gateway"
endpoint = "client"

[[services]]
service_name = "player"
endpoint = "internal-rpc"

[[services]]
service_name = "guild"
endpoint = "internal-rpc"
