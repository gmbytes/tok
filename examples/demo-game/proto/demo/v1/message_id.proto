syntax = "proto3";

package demo.v1;

// 游戏消息 ID 的唯一来源；数值发布后保持稳定，删除时 reserved 编号和名称。
// MESSAGE_ID_<消息类型的 UPPER_SNAKE_CASE> 与同名 message 在构建时关联。
enum MessageId {
  MESSAGE_ID_UNSPECIFIED = 0;
  MESSAGE_ID_GET_PLAYER_REQUEST = 1;
  MESSAGE_ID_GET_PLAYER_RESPONSE = 2;
  MESSAGE_ID_GET_GUILD_REQUEST = 3;
  MESSAGE_ID_GET_GUILD_RESPONSE = 4;
  MESSAGE_ID_SET_PLAYER_REQUEST = 5;
  MESSAGE_ID_SET_PLAYER_RESPONSE = 6;
  MESSAGE_ID_QUERY_GUILD_REQUEST = 7;
  MESSAGE_ID_QUERY_GUILD_RESPONSE = 8;
  MESSAGE_ID_START_PRODUCTION_REQUEST = 9;
  MESSAGE_ID_START_PRODUCTION_RESPONSE = 10;
  // 内部计时消息；枚举值本身不授予游戏客户端调用权限。
  MESSAGE_ID_PRODUCTION_FINISHED = 11;
}
