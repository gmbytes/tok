syntax = "proto3";

package demo.v1;

// 业务协议只属于示例游戏，框架 crate 不依赖这些类型。
message GetPlayerRequest {
  uint64 player_id = 1;
}

message GetPlayerResponse {
  uint64 player_id = 1;
  int64 value = 2;
}

message SetPlayerRequest { int64 value = 1; }
message SetPlayerResponse {
  uint64 player_id = 1;
  int64 value = 2;
}
message QueryGuildRequest { uint64 guild_id = 1; }
message QueryGuildResponse { uint64 guild_id = 1; }

// 客户端只发起生产，耗时和产出由服务端规则决定。
message StartProductionRequest {}
message StartProductionResponse {}
// 仅供内部生产完成处理函数使用。
message ProductionFinished {}

message GetGuildRequest {
  uint64 guild_id = 1;
}

message GetGuildResponse {
  uint64 guild_id = 1;
}

// Core NATS 广播示例，仅作为客户端 Notify。
message ValueNotice { int64 value = 1; }
