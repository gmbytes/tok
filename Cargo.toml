[workspace]
members = ["crates/*", "examples/demo-game"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.dependencies]
lru = { version = "0.18.5", default-features = false }
async-nats = { version = "0.50.0", default-features = false, features = ["ring", "nuid"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
tok-core = { path = "crates/tok-core", version = "0.1.0" }
tok-player = { path = "crates/tok-player", version = "0.1.0" }
tok-execution = { path = "crates/tok-execution", version = "0.1.0" }
tok-lifecycle = { path = "crates/tok-lifecycle", version = "0.1.0" }
tok-proto = { path = "crates/tok-proto", version = "0.1.0" }
tok-protobuf = { path = "crates/tok-protobuf", version = "0.1.0" }
tok-message = { path = "crates/tok-message", version = "0.1.0" }
tok-grpc = { path = "crates/tok-grpc", version = "0.1.0" }
tok-events = { path = "crates/tok-events", version = "0.1.0" }
tok-infra = { path = "crates/tok-infra", version = "0.1.0" }
tok-gateway = { path = "crates/tok-gateway", version = "0.1.0" }
tok = { path = "crates/tok", version = "0.1.0" }
tok-observability = { path = "crates/tok-observability", version = "0.1.0" }
clap = { version = "4.5", features = ["derive"] }
prost = "0.14.4"
prost-build = "0.14.4"
heck = "0.5"
protoc-bin-vendored = "3.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp", "script"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22.1"
getrandom = "0.4.3"
hmac = "0.13.0"
sha2 = "0.11.0"
thiserror = "2"
toml = "1.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = { version = "0.5", features = ["limit", "load-shed", "timeout", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["trace", "gen-tonic"] }
tokio-stream = { version = "0.1", features = ["net"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
let_underscore_future = "deny"
large_futures = "deny"
unimplemented = "deny"
module_name_repetitions = "deny"
clone_on_ref_ptr = "deny"
unused_async = "deny"
let_underscore_must_use = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
