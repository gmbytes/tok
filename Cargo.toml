[workspace]
members = ["crates/*", "examples/demo-game"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.dependencies]
tok-core = { path = "crates/tok-core", version = "0.1.0" }
tok-proto = { path = "crates/tok-proto", version = "0.1.0" }
tok-rpc = { path = "crates/tok-rpc", version = "0.1.0" }
tok-events = { path = "crates/tok-events", version = "0.1.0" }
tok-infra = { path = "crates/tok-infra", version = "0.1.0" }
tok-gateway = { path = "crates/tok-gateway", version = "0.1.0" }
tok = { path = "crates/tok", version = "0.1.0" }
clap = { version = "4.5", features = ["derive"] }
prost = "0.14.4"
prost-build = "0.14.4"
protoc-bin-vendored = "3.3.0"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1.1"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = { version = "0.5", features = ["limit", "load-shed", "timeout", "util"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
