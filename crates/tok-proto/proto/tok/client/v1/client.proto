syntax = "proto3";
package tok.client.v1;

// TCP 以 4 字节大端长度前缀承载此逻辑信封，长度不含前缀。
message Frame {
  uint32 version = 1;
  oneof content {
    LoginRequest login = 2;
    LoginResponse logged_in = 3;
    BusinessRequest request = 4;
    BusinessResponse response = 5;
    Notify notify = 6;
    ControlError error = 7;
    Ack ack = 8;
    ResumeRequest resume = 9;
    ResumeResponse resumed = 10;
    RecoveryComplete recovered = 11;
    RefreshResumeTokenRequest refresh_resume_token = 12;
    RefreshResumeTokenResponse resume_token_refreshed = 13;
  }
}
message LoginRequest {
  uint64 request_id = 1;
  string credential = 2;
  // 快速重登凭证，与 credential 二选一；创建新逻辑会话。
  string resume_token = 3;
}
message LoginResponse {
  uint64 request_id = 1;
  uint32 error_code = 2;
  string player_id = 3;
  string session_id = 4;
  uint64 epoch = 5;
  string resume_token = 6;
  uint64 resume_token_ttl_ms = 7;
}
// 新连接恢复原逻辑会话，不重新执行业务。
message ResumeRequest {
  uint64 request_id = 1;
  string resume_token = 2;
  uint64 ack_seq = 3;
}
message ResumeResponse {
  uint64 request_id = 1;
  uint32 error_code = 2;
  string player_id = 3;
  string session_id = 4;
  uint64 epoch = 5;
  // 网关已见过的最大业务请求 ID；新请求必须更大，不能重发未知结果请求。
  uint64 last_request_id = 6;
}
// 在此标记之前完成按原序号补发；其后恢复普通交互。
message RecoveryComplete {
  uint64 through_seq = 1;
}
message BusinessRequest {
  uint64 request_id = 1;
  uint32 message_id = 2;
  bytes body = 3;
}
message BusinessResponse {
  uint64 request_id = 1;
  uint32 message_id = 2;
  uint32 error_code = 3;
  bytes body = 4;
  // 同一逻辑会话的下行序号，从 1 开始，包含失败回应。
  uint64 server_seq = 5;
}
message Notify {
  uint32 message_id = 1;
  bytes body = 2;
  // 与 BusinessResponse 共用连续下行序列。
  uint64 server_seq = 3;
}
// 客户端已连续应用到业务状态的最大序号，绑定当前连接的会话。
message Ack {
  uint64 ack_seq = 1;
}
message ControlError {
  uint64 request_id = 1;
  uint32 error_code = 2;
}

// 仅当前已认证且恢复完成的连接可刷新，不需要提交旧 token。
message RefreshResumeTokenRequest {
  uint64 request_id = 1;
}
// 控制回应，不占 server_seq，不进入补发缓存；失败时凭证字段为空。
message RefreshResumeTokenResponse {
  uint64 request_id = 1;
  uint32 error_code = 2;
  string resume_token = 3;
  uint64 resume_token_ttl_ms = 4;
}
