syntax = "proto3";

package tok.internal.v1;

// 内部调用传递的游戏消息，不包含任何具体游戏的 protobuf 类型。
message Payload {
  uint32 message_id = 1;
  bytes body = 2;
}

// 内部错误描述，客户端错误码映射由游戏协议定义。
message RpcError {
  uint32 code = 1;
  string message = 2;
}

// 服务名与 protobuf 服务由组装层绑定，不从客户端正文信任玩家身份。
message SessionIdentity {
  string player_id = 1;
  string session_id = 2;
  uint64 epoch = 3;
}

message CallContext {
  string node_id = 1;
  string service_name = 2;
  optional string bid = 3;
  uint64 request_id = 4;
  SessionIdentity session = 5;
}

message CallRequest {
  CallContext context = 1;
  Payload payload = 2;
  // 仅由可信网关提供；客户端业务正文不能指定计时来源。
  TimerTrigger timer = 3;
}

message TimerTrigger {
  string timer_id = 1;
  int64 scheduled_at_ms = 2;
  int64 fired_at_ms = 3;
}

message TimerSpec {
  string timer_id = 1;
  uint32 message_id = 2;
  bytes body = 3;
  int64 due_at_ms = 4;
  optional uint64 interval_ms = 5;
}

message TimerSet { repeated TimerSpec timers = 1; }
message TimerPatch {
  repeated TimerSpec upsert = 1;
  repeated string cancel = 2;
}
message TimerUpdate {
  oneof update {
    TimerSet replace_all = 1;
    TimerPatch patch = 2;
  }
}

message CallResponse {
  uint64 request_id = 1;
  Payload payload = 2;
  RpcError error = 3;
  // 内部计时需求，不直接发给客户端。
  TimerUpdate timers = 4;
}

// 只允许会话驱动的 player 入口。身份可信性由部署和认证组件保证。
service PlayerRpc {
  rpc Call(CallRequest) returns (CallResponse);
  // 仅内部转发事件；不与客户端请求或 timer 混用。
  rpc HandleEvent(EventRequest) returns (EventResponse);
}

// 可配置的业务入口，不根据名称自动加锁或固定中间件链。
service BusinessRpc {
  rpc Call(CallRequest) returns (CallResponse);
}

// 服务器事件的网络封装；不携带客户端消息 ID 或网关处理方式。
message EventEnvelope {
  uint32 version = 1;
  string event_id = 2;
  string event_type = 3;
  bytes body = 4;
  // traceparent / tracestate 由 NATS headers 传递。
}

// 会话内部事件的执行结果，不包含客户端回应。
message EventResponse {
  uint64 request_id = 1;
  RpcError error = 2;
  TimerUpdate timers = 3;
}

message EventRequest {
  CallContext context = 1;
  string event_id = 2;
  string event_type = 3;
  bytes body = 4;
}
